name: Daily anime fetch

on:
  schedule:
    - cron: '0 4 * * *'   # every day at 04:00 UTC
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: fetch

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: fetch/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug secrets/env
        env:
          MAL_USERS: ${{ secrets.MAL_USERS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MAL_TOKEN_JSON: ${{ secrets.MAL_TOKEN }}
        run: |
          echo "--- secret presence (true if non-empty) ---"
          echo "MAL_USERS set: ${{ secrets.MAL_USERS != '' }}"
          echo "FIREBASE_SERVICE_ACCOUNT set: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}"
          echo "MAL_TOKEN set: ${{ secrets.MAL_TOKEN != '' }}"
          echo "--- env var lengths (in runner) ---"
          echo "MAL_USERS length: ${#MAL_USERS}"
          echo "FIREBASE_SERVICE_ACCOUNT length: ${#FIREBASE_SERVICE_ACCOUNT}"
          echo "MAL_TOKEN_JSON length: ${#MAL_TOKEN_JSON}"
          echo "--- env var first chars (will be masked if matches secret) ---"
          echo "MAL_USERS first 20: ${MAL_USERS:0:20}"
          echo "FIREBASE_SERVICE_ACCOUNT first 20: ${FIREBASE_SERVICE_ACCOUNT:0:20}"
          echo "MAL_TOKEN_JSON first 20: ${MAL_TOKEN_JSON:0:20}"
          echo "--- python view ---"
          python -c "import os; v = os.environ.get('FIREBASE_SERVICE_ACCOUNT'); print('FIREBASE set in python:', v is not None, 'len:', len(v) if v else 0)"
          python -c "import os; v = os.environ.get('MAL_TOKEN_JSON'); print('MAL_TOKEN_JSON set in python:', v is not None, 'len:', len(v) if v else 0)"

      - name: Run fetch
        env:
          MAL_USERS: ${{ secrets.MAL_USERS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MAL_TOKEN_JSON: ${{ secrets.MAL_TOKEN }}
        run: python execute.py
