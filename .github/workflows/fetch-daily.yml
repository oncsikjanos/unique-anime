name: Daily anime fetch

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: fetch

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: fetch/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch
        env:
          MAL_USERS: ${{ secrets.MAL_USERS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MAL_TOKEN_JSON: ${{ secrets.MAL_TOKEN }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
        run: |
          echo "--- secret presence (true if non-empty) ---"
          echo "MAL_USERS set: ${{ secrets.MAL_USERS != '' }}"
          echo "FIREBASE_SERVICE_ACCOUNT set: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}"
          echo "MAL_TOKEN set: ${{ secrets.MAL_TOKEN != '' }}"
          echo "MAL_CLIENT_SECRET set: ${{ secrets.MAL_CLIENT_SECRET != '' }}"
          python execute.py

      - name: Persist rotated MAL token
        # Runs even if the fetch failed: the refresh happens first, so the file
        # holds a valid rotated token that must replace the now-invalid secret.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f token_myanimelist.json ]; then
            gh secret set MAL_TOKEN --repo "$GITHUB_REPOSITORY" --body "$(cat token_myanimelist.json)"
            echo "MAL_TOKEN secret updated."
          else
            echo "No rotated token file found; refresh did not run. Skipping."
          fi

  check-pat-expiry:
    runs-on: ubuntu-latest
    steps:
      - name: Warn if GH_PAT is close to expiring
        # Fails when the PAT is within 7 days of expiry. A failed scheduled run
        # makes GitHub email the workflow's last committer, so you get a heads-up
        # in time to rotate GH_PAT before the token refresh silently breaks.
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          exp=$(gh api -i user 2>/dev/null \
            | tr -d '\r' \
            | awk -F': ' 'tolower($1)=="github-authentication-token-expiration"{print $2}')
          if [ -z "$exp" ]; then
            echo "::warning::Could not read GH_PAT expiration (request failed, or a classic token without expiry)."
            exit 0
          fi
          exp_epoch=$(date -d "$exp" +%s) || { echo "::warning::Could not parse expiration '$exp'"; exit 0; }
          days_left=$(( (exp_epoch - $(date +%s)) / 86400 ))
          echo "GH_PAT expires on $exp ($days_left days left)."
          if [ "$days_left" -le 7 ]; then
            echo "::error::GH_PAT expires in $days_left day(s) on $exp. Rotate it or the daily MAL token refresh will break."
            exit 1
          fi
          if [ "$days_left" -le 21 ]; then
            echo "::warning::GH_PAT expires in $days_left day(s) on $exp. Plan to rotate it soon."
          fi
