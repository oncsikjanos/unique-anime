name: Daily anime fetch

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: fetch

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: fetch/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch
        env:
          MAL_USERS: ${{ secrets.MAL_USERS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MAL_TOKEN_JSON: ${{ secrets.MAL_TOKEN }}
        run: |
          echo "--- secret presence (true if non-empty) ---"
          echo "MAL_USERS set: ${{ secrets.MAL_USERS != '' }}"
          echo "FIREBASE_SERVICE_ACCOUNT set: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}"
          echo "MAL_TOKEN set: ${{ secrets.MAL_TOKEN != '' }}" 
          python execute.py
