name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p frontend/src/environments && echo "${{ secrets.FIREBASE_ENV }}" > frontend/src/environments/environment.ts
      - run: cd frontend && npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TOXICTSUNIQUEANIME }}
          channelId: live
          projectId: toxictsuniqueanime
          entryPoint: frontend
